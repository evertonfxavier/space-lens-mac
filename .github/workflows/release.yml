name: Release

# Releases are driven by the VERSION file: merge a change to VERSION (and the matching CHANGELOG.md section)
# into main and this workflow publishes the GitHub release. Nothing happens if that version already exists.
# "Run workflow" retries a failed release.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::VERSION '$VERSION' is not semver (x.y.z or x.y.z-suffix)"; exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build (universal)
        run: make universal

      - name: Check architectures
        run: |
          archs="$(lipo -archs build/SpaceLens.app/Contents/MacOS/SpaceLens)"
          echo "archs: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - name: Package
        run: ./scripts/package.sh all

      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" 'index($0,"## [")==1 { p = (index($0,h)==1); next } p' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          1. Download \`SpaceLens-$VERSION.dmg\` (or the zip) and drag **SpaceLens** to Applications.
          2. The app is not notarized. On first launch macOS may say it cannot be opened: go to
             **System Settings → Privacy & Security → Open Anyway**, or run
             \`xattr -dr com.apple.quarantine /Applications/SpaceLens.app\`.
          3. Grant **Full Disk Access** (System Settings → Privacy & Security) to see Mail, Messages, Safari and the Trash.

          Universal binary (Apple silicon + Intel), macOS 14 or later. Verify downloads with \`SHA256SUMS.txt\`.
          EOF
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" build/dist/* \
            --target "$GITHUB_SHA" \
            --title "SpaceLens $VERSION" \
            --notes-file notes.md \
            ${flags[@]+"${flags[@]}"}
