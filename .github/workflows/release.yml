name: Release

# Fully automatic. Every push to main is looked at by scripts/release.py, which reads the Conventional Commits since
# the latest v* tag and decides the next version:
#   feat -> minor, fix / perf / refactor -> patch, breaking (type! or BREAKING CHANGE) -> major (minor while 0.x)
#   docs, chore, ci, test, style, build -> no release by themselves
# When a release is due the workflow writes VERSION and CHANGELOG.md, tests, builds a universal binary, commits the
# two files back to main ("chore(release): x.y.z [skip ci]") and publishes the GitHub release at that commit.
# A VERSION that has no tag yet is released as it is, so bumping it by hand still works.
# "Run workflow" can force a release (patch / minor / major) or retry a failed one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Force a release even if no commit asks for one
        type: choice
        options: [none, patch, minor, major]
        default: none

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    # The release commit pushed by this workflow does not start another run (GITHUB_TOKEN pushes never do), this is
    # only a second guard.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release planner tests
        run: python3 scripts/test_release.py

      - name: Plan
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          args=()
          if [ -n "${BUMP:-}" ] && [ "$BUMP" != "none" ]; then args+=(--bump "$BUMP"); fi
          python3 scripts/release.py plan ${args[@]+"${args[@]}"} | tee plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write VERSION and CHANGELOG
        run: python3 scripts/release.py apply --version "$VERSION" --notes notes.md

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build (universal)
        run: make universal

      - name: Check architectures
        run: |
          archs="$(lipo -archs build/SpaceLens.app/Contents/MacOS/SpaceLens)"
          echo "archs: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - name: Package
        run: ./scripts/package.sh all

      - name: Commit VERSION and CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- VERSION CHANGELOG.md; then
            echo "VERSION and CHANGELOG already up to date."
          else
            git add VERSION CHANGELOG.md
            git commit -m "chore(release): $VERSION [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "SpaceLens $VERSION" \
            --notes-file notes.md
